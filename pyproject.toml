[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailortex"
version = "0.1.0"
description = "Tailor a LaTeX resume to any job description with Gemini - without inventing anything."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Piyush Singh" }]
dependencies = [
  "google-genai>=1.0",
  "openai>=1.40",
  "pydantic>=2.5",
  "pdfplumber>=0.10",
  "python-docx>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.46"]
dev = ["pytest>=8"]

[project.scripts]
tailortex = "tailortex.cli:main"

[tool.setuptools]
packages = ["tailortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
